<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грань Веков</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b10;
  color:white;
  padding-bottom:140px;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  background:#111;
}

#search{
  padding:8px;
  width:200px;
  border-radius:8px;
  border:none;
  background:#1a1a25;
  color:white;
}

.side button{
  background:#222;
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a25;
  padding:12px;
  border-radius:14px;
}

.card img{
  width:100%;
  border-radius:10px;
}

.card.active{
  border:1px solid #ff3c3c;
}

/* STATS */
.stats{
  margin-top:6px;
  font-size:13px;
  opacity:0.8;
  display:flex;
  justify-content:center;
  gap:12px;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

/* DOWNLOAD */
.downloadBtn{
  margin-top:8px;
  height:38px;
  background:#222236;
  border-radius:10px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

/* PLAYER */
#player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f0f18;
  display:flex;
  gap:10px;
  padding:10px;
  align-items:center;
}

#cover{
  width:50px;
  height:50px;
  border-radius:8px;
}

.controls button{
  width:auto;
  padding:6px 10px;
}

#progress{
  width:100%;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="side"><button onclick="ads()">📢</button></div>
  <input id="search" placeholder="Поиск...">
  <div class="side"><button onclick="donate()">💰</button></div>
</div>

<div class="container" id="list"></div>

<!-- PLAYER -->
<div id="player">
  <img id="cover">
  <div style="flex:1">
    <div id="title">Выбери трек</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range" value="0">
  </div>

  <audio id="audio"></audio>
</div>

<script>

/* ================= TRACKS ================= */
const tracks = [
  {title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"},
  {title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.jpg"},
  {title:"Кролик Роджер", file:"music/track4.mp3", cover:"music/cover4.jpg"},
  {title:"Падший Ангел", file:"music/track5.mp3", cover:"music/cover5.jpg"},
  {title:"Белоснежка и семь грехов", file:"music/track6.mp3", cover:"music/cover6.jpg"},
  {title:"Сын Дьявола", file:"music/track7.mp3", cover:"music/cover7.jpg"},
  {title:"До последнего шага", file:"music/track8.mp3", cover:"music/cover8.jpg"}
];

let current = -1;
let cards = [];

/* ================= STATS ================= */
const stats = JSON.parse(localStorage.getItem("stats") || "{}");

function saveStats(){
  localStorage.setItem("stats", JSON.stringify(stats));
}

/* ================= ELEMENTS ================= */
const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const playBtn = document.getElementById("playBtn");
const list = document.getElementById("list");
const search = document.getElementById("search");

/* ================= PLAY ================= */
function safePlay(){
  audio.play().catch(()=>{});
}

function load(i){
  current = i;

  if(!stats[i]) stats[i] = {play:0, download:0};

  audio.src = tracks[i].file;
  title.textContent = tracks[i].title;
  cover.src = tracks[i].cover;

  stats[i].play++;
  saveStats();

  syncUI();
  safePlay();
}

/* ================= CONTROLS ================= */
function toggle(){
  if(current === -1) return load(0);
  audio.paused ? safePlay() : audio.pause();
}

function next(){ load((current+1)%tracks.length); }
function prev(){ load((current-1+tracks.length)%tracks.length); }

/* ================= UI ================= */
function syncUI(){
  playBtn.textContent = audio.paused ? "▶" : "⏸";

  cards.forEach((c,i)=>{
    c.classList.toggle("active", i===current && !audio.paused);
  });
}

/* ================= EVENTS ================= */
audio.addEventListener("ended", next);
audio.addEventListener("play", syncUI);
audio.addEventListener("pause", syncUI);

audio.ontimeupdate = ()=>{
  if(audio.duration)
    progress.value = (audio.currentTime/audio.duration)*100;
};

progress.oninput = ()=>{
  audio.currentTime = (progress.value/100)*audio.duration;
};

/* ================= CARDS ================= */
tracks.forEach((t,i)=>{
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${t.cover}">
    <h3>${t.title}</h3>

    <div class="stats">
      👁 ${stats[i]?.play || 0}
      ⬇ ${stats[i]?.download || 0}
    </div>

    <button onclick="load(${i})">▶ Play</button>

    <div class="downloadBtn" onclick="downloadTrack(${i})">
      <div class="fill"></div>
      <span>⬇ Скачать</span>
    </div>
  `;

  list.appendChild(div);
  cards.push(div);
});

/* ================= DOWNLOAD ================= */
function downloadTrack(i){
  const t = tracks[i];
  const card = cards[i];
  const fill = card.querySelector(".fill");

  const xhr = new XMLHttpRequest();
  xhr.open("GET", t.file, true);
  xhr.responseType = "blob";

  xhr.onprogress = e=>{
    if(e.lengthComputable){
      fill.style.width = (e.loaded/e.total)*100+"%";
    }
  };

  xhr.onload = ()=>{
    const url = URL.createObjectURL(xhr.response);

    const a = document.createElement("a");
    a.href = url;

    const safeName = t.title.replace(/[\/\\:*?"<>|]/g,"");
    a.download = safeName+".mp3";

    stats[i].download++;
    saveStats();

    a.click();
    URL.revokeObjectURL(url);

    fill.style.width = "0%";
  };

  xhr.send();
}

/* ================= SEARCH ================= */
search.addEventListener("input", ()=>{
  const v = search.value.toLowerCase();

  cards.forEach((c,i)=>{
    c.style.display =
      tracks[i].title.toLowerCase().includes(v)
      ? "block"
      : "none";
  });
});

/* ================= BUTTONS ================= */
function donate(){
  window.open("https://paypal.me/yourlink");
}

function ads(){
  alert("Реклама");
}

</script>
</body>
</html>
