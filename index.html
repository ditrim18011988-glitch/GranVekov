<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
  cursor: url("music/rock-cursor.png"), auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
  gap:10px;
}

#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

.side{ width:60px; display:flex; justify-content:center; }

.logo{
  display:flex;
  justify-content:center;
  margin:40px 0;
}

.logo img{
  height:420px;
  max-width:95vw;
  border-radius:16px;
}

.container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  padding:20px;
  padding-bottom:120px;
}

.card {
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
  opacity:0;
  transform:translateY(12px);
  animation:fadeIn 0.5s ease forwards;
}

.card.active{
  border:1px solid #ff3c3c;
  box-shadow:0 0 25px rgba(255,60,60,0.4);
}

@keyframes fadeIn {
  to { opacity:1; transform:translateY(0); }
}

.card img{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

.downloadBtn{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  height:40px;
  margin-top:8px;
  background:#222236;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
  transition:width 0.1s linear;
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

#player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  padding:10px;
  display:flex;
  gap:10px;
}

#cover{ width:50px; height:50px; border-radius:8px; }

.controls{ display:flex; gap:5px; }
.controls button{ width:auto; }
</style>
</head>

<body>

<div class="topbar">
  <div class="side"><button onclick="ads()">📢</button></div>
  <input id="search" placeholder="Поиск музыки...">
  <div class="side"><button onclick="donate()">💰</button></div>
</div>

<div class="logo">
  <img src="music/logo.png">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">
  <div>
    <div id="title">Выбери трек</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶️</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range" value="0">
    <audio id="audio"></audio>
  </div>
</div>

<script>

const tracks = [
  {title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"},
  {title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.png"}
];

let current = -1;
let cards = [];

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const playBtn = document.getElementById("playBtn");
const list = document.getElementById("list");
const search = document.getElementById("search");

/* ===== SAFE PLAY ===== */
function safePlay(){
  const p = audio.play();
  if(p && p.catch) p.catch(()=>{});
}

/* ===== LOAD TRACK ===== */
function load(i){
  current = i;

  audio.src = tracks[i].file;
  title.textContent = tracks[i].title;
  cover.src = tracks[i].cover;

  safePlay();
  setActive(i);
  syncUI();
}

/* ===== ACTIVE CARD ===== */
function setActive(i){
  cards.forEach(c => c.classList.remove("active"));
  if(cards[i]) cards[i].classList.add("active");
}

/* ===== TOGGLE FROM CARD (FIX) ===== */
function toggleCard(i){
  if(i === current){
    if(audio.paused) safePlay();
    else audio.pause();
  } else {
    load(i);
  }
  syncUI();
}

/* ===== PLAYER TOGGLE ===== */
function toggle(){
  if(audio.paused) safePlay();
  else audio.pause();
  syncUI();
}

/* ===== SYNC UI ===== */
function syncUI(){
  playBtn.textContent = audio.paused ? "▶️" : "⏸";

  cards.forEach((c,i)=>{
    const btn = c.querySelector("button");
    if(!btn) return;

    btn.textContent =
      (i === current && !audio.paused)
        ? "⏸ Pause"
        : "▶ Play";
  });
}

/* ===== NEXT / PREV ===== */
function next(){ load((current+1)%tracks.length); }
function prev(){ load((current-1+tracks.length)%tracks.length); }

/* ===== EVENTS ===== */
audio.addEventListener("play", syncUI);
audio.addEventListener("pause", syncUI);
audio.addEventListener("ended", next);

/* ===== PROGRESS ===== */
audio.ontimeupdate = () => {
  if(audio.duration){
    progress.value = (audio.currentTime/audio.duration)*100;
  }
};

progress.oninput = () => {
  audio.currentTime = (progress.value/100)*audio.duration;
};

/* ===== CARDS ===== */
tracks.forEach((t,i)=>{
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${t.cover}">
    <h3>${t.title}</h3>
    <button onclick="toggleCard(${i})">▶ Play</button>

    <div class="downloadBtn" onclick="downloadTrack(${i})">
      <div class="fill"></div>
      <span>⬇ Скачать</span>
    </div>
  `;

  list.appendChild(div);
  cards.push(div);
});

/* ===== DOWNLOAD ===== */
function downloadTrack(i){
  const t = tracks[i];
  const btn = cards[i].querySelector(".downloadBtn");
  const fill = btn.querySelector(".fill");
  const text = btn.querySelector("span");

  fetch(t.file)
    .then(r => r.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = t.title + ".mp3";
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);

      fill.style.width = "100%";
      text.textContent = "✔ Готово";

      setTimeout(()=>{
        fill.style.width = "0%";
        text.textContent = "⬇ Скачать";
      },800);
    });
}

/* ===== SEARCH ===== */
search.oninput = () => {
  const v = search.value.toLowerCase();
  cards.forEach((c,i)=>{
    c.style.display = tracks[i].title.toLowerCase().includes(v) ? "block":"none";
  });
};

/* ===== EXTRA ===== */
function donate(){ window.open("https://paypal.me/yourlink"); }
function ads(){ alert("Реклама"); }

</script>

</body>
</html>
