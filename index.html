<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;

  cursor: url("music/rock-cursor.png"), auto;

  padding-bottom: calc(140px + env(safe-area-inset-bottom));
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
  gap:10px;
}

#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

.logo{
  display:flex;
  justify-content:center;
  margin:30px 0;
}

.logo img{
  max-width:90vw;
  max-height:420px;
  border-radius:16px;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
  transition:.2s;
}

.card.active{
  border:1px solid #ff3c3c;
  box-shadow:0 0 20px rgba(255,60,60,0.5);
}

.card img{
  width:100%;
  border-radius:12px;
}

/* BUTTON */
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor: pointer;
}

/* DOWNLOAD */
.downloadBtn{
  position:relative;
  height:40px;
  margin-top:8px;
  border-radius:10px;
  overflow:hidden;
  background:#222236;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
  pointer-events:none;
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

/* 🔥 ВАЖНЫЙ ФИКС КУРСОРА */
button, .downloadBtn{
  cursor: pointer !important;
}

.stats{
  margin-top:6px;
  font-size:13px;
  opacity:0.8;
  display:flex;
  justify-content:center;
  gap:10px;
}

/* PLAYER */
#player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:rgba(10,10,18,0.95);
  backdrop-filter:blur(20px);
  height:92px;
  box-sizing:border-box;
  z-index:999;
}

#cover{
  width:58px;
  height:58px;
  border-radius:10px;
}

#progress{
  width:100%;
}
</style>
</head>

<body>
<div id="donateModal" style="display:none;">
  <div class="donateOverlay" onclick="closeDonate()"></div>

  <div class="donateBox">
    <h2>Поддержать проект</h2>

    <button onclick="goBoosty('5')">10 ₽ → поддержать</button>
    <button onclick="goBoosty('10')">20 ₽ → спасибо</button>
    <button onclick="goBoosty('20')">30 ₽ → нравится трек</button>
    <button onclick="goBoosty('50')">100 ₽ → очень зашло</button>
    <button onclick="goBoosty('100')">300 ₽ → хочу больше такого контента</button>

    <button class="closeBtn" onclick="closeDonate()">Закрыть</button>
  </div>
</div>
<div class="topbar">
  <button onclick="ads()">📢 Реклама</button>
  <input id="search" placeholder="Поиск музыки...">
  <button onclick="donate()">💰 Донат</button>
</div>

<div class="logo">
  <img src="music/logo.png">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">

  <div>
    <div id="title">Выбери трек</div>
    <div>
  <span id="currentTime">0:00</span>
  <span id="duration">-0:00</span>
</div>

    <div style="display:flex; gap:6px;">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶️</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range" value="0">
  </div>

  <audio id="audio"></audio>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDpJnhB5v-YuiA111gVFqO5beQKcOqsRZI",
  authDomain: "gran-vekov.firebaseapp.com",
  projectId: "gran-vekov",
  storageBucket: "gran-vekov.firebasestorage.app",
  messagingSenderId: "491233287135",
  appId: "1:491233287135:web:bf6fdfc9bd3da5b2abc26a",
  measurementId: "G-2VLR21RWRT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* TRACKS */
const tracks = [
  {id:20, title:"Сын Дьявола V.2", file:"music/track1.3.mp3", cover:"music/cover1.3.png"},
  {id:19, title:"Проклятье Салема", file:"music/track17.mp3", cover:"music/cover17.png"},
  {id:18, title:"Эпос Драконорождённый", file:"music/track16.mp3", cover:"music/cover16.png"},
  {id:17, title:"Аид V.2", file:"music/track1.2.mp3", cover:"music/cover1.2.png"},
  {id:16, title:"Северный рубеж V.2", file:"music/track1.1.mp3", cover:"music/cover1.1.png"},
  {id:15, title:"Крампус", file:"music/track15.mp3", cover:"music/cover15.png"},
  {id:14, title:"Северный рубеж", file:"music/track14.mp3", cover:"music/cover14.jpg"},
  {id:13, title:"Безмолвный город", file:"music/track13.mp3", cover:"music/cover13.jpg"},
  {id:12, title:"Аид", file:"music/track12.mp3", cover:"music/cover12.jpg"},
  {id:11, title:"Пиковая Дама", file:"music/track11.mp3", cover:"music/cover11.jpg"},
  {id:10, title:"Питер Пэн - Похититель детей", file:"music/track10.mp3", cover:"music/cover10.jpg"},
  {id:9, title:"Распутин-Демон порока", file:"music/track9.mp3", cover:"music/cover9.jpg"},
  {id:8, title:"До последнего шага", file:"music/track8.mp3", cover:"music/cover8.jpg"},
  {id:7, title:"Сын Дьявола", file:"music/track7.mp3", cover:"music/cover7.jpg"},
  {id:6, title:"Белоснежка и семь грехов: Союз тьмы", file:"music/track6.mp3", cover:"music/cover6.jpg"},
  {id:5, title:"Падший Ангел", file:"music/track5.mp3", cover:"music/cover5.jpg"},
  {id:4, title:"Кролик Роджер", file:"music/track4.mp3", cover:"music/cover4.jpg"},
  {id:3, title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.jpg"},
  {id:2, title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {id:1, title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"}
];


const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const playBtn = document.getElementById("playBtn");
const list = document.getElementById("list");
const progress = document.getElementById("progress");

const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

let current = -1;
let cards = [];

/* ================= FIREBASE CHECK ================= */

if (!db) {
  console.error("Firebase DB не подключён!");
}

/* ================= SAFE ================= */

function safePlay(){
  audio.play().catch(()=>{});
}

function formatTime(sec){
  if (!sec || isNaN(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" + s : s);
}

/* ================= STATS ================= */

function ensureStats(id){
  if (!db) return;

  const ref = db.collection("stats").doc(String(id));

  ref.get().then(doc=>{
    if(!doc.exists){
      ref.set({views:0, downloads:0});
    }
  });
}

function updateStatsUI(i, data){
  const card = cards[i];
  if(!card) return;

  const stats = card.querySelector(".stats");
  if(!stats) return;

  stats.innerHTML = `👁 ${data?.views || 0} ⬇ ${data?.downloads || 0}`;
}

function addView(id, i){
  const ref = db.collection("stats").doc(String(id));

  ref.set({
    views: firebase.firestore.FieldValue.increment(1)
  }, {merge:true});
}

/* ================= PLAYER ================= */

function load(i){
  if(!tracks || !tracks[i]) return;

  current = i;

  audio.src = tracks[i].file;
  title.textContent = tracks[i].title;
  cover.src = tracks[i].cover;

  audio.currentTime = 0;
  safePlay();

  syncUI();

  addView(tracks[i].id, i);
}

function toggle(){
  if(current === -1){
    load(0);
    return;
  }

  audio.paused ? safePlay() : audio.pause();
  syncUI();
}

function next(){
  load((current + 1) % tracks.length);
}

function prev(){
  load((current - 1 + tracks.length) % tracks.length);
}

function toggleTrack(i){
  if(i !== current) load(i);
  else toggle();
}

/* ================= PROGRESS ================= */

audio.addEventListener("timeupdate", () => {
  if(!audio.duration) return;

  progress.value = (audio.currentTime / audio.duration) * 100;

  if(currentTimeEl)
    currentTimeEl.textContent = formatTime(audio.currentTime);

  if(durationEl)
    durationEl.textContent = "-" + formatTime(audio.duration - audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  progress.value = 0;

  if(currentTimeEl) currentTimeEl.textContent = "0:00";
  if(durationEl) durationEl.textContent = "-" + formatTime(audio.duration);
});

progress.addEventListener("input", () => {
  if(!audio.duration) return;
  audio.currentTime = (progress.value / 100) * audio.duration;
});

/* ================= UI ================= */

function syncUI(){
  playBtn.textContent = audio.paused ? "▶️" : "⏸";

  cards.forEach((c,i)=>{
    const btn = c.querySelector("button");

    if(i === current){
      c.classList.add("active");
      btn.textContent = audio.paused ? "▶ Play" : "⏸ Pause";
    } else {
      c.classList.remove("active");
      btn.textContent = "▶ Play";
    }
  });
}

/* ================= CARDS (ВАЖНО!) ================= */

function initCards(){

  if(!tracks || tracks.length === 0){
    console.error("tracks пустой!");
    return;
  }

  tracks.forEach((t,i)=>{

    ensureStats(t.id);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${t.cover}">
      <h3>${t.title}</h3>

      <div class="stats">👁 0 ⬇ 0</div>

      <button onclick="toggleTrack(${i})">▶ Play</button>

      <div class="downloadBtn" onclick="downloadTrack(${i})">
        <div class="fill"></div>
        <span>⬇ Скачать</span>
      </div>
    `;

    list.appendChild(div);
    cards.push(div);

    db.collection("stats").doc(String(t.id)).onSnapshot(doc=>{
      if(doc.exists){
        updateStatsUI(i, doc.data());
      }
    });
  });
}

/* ================= DOWNLOAD ================= */

function downloadTrack(i){
  const t = tracks[i];
  const card = cards[i];
  if(!card) return;

  const fill = card.querySelector(".fill");

  const xhr = new XMLHttpRequest();
  xhr.open("GET", t.file);
  xhr.responseType = "blob";

  xhr.onprogress = (e)=>{
    if(e.lengthComputable){
      fill.style.width = (e.loaded / e.total) * 100 + "%";
    }
  };

  xhr.onload = ()=>{

    const url = URL.createObjectURL(xhr.response);

    const a = document.createElement("a");
    a.href = url;
    a.download = t.title + ".mp3";
    a.click();

    URL.revokeObjectURL(url);

    fill.style.width = "0%";

    /* 💥 ВОТ ЭТО ТЫ ЗАБЫЛ */
    db.collection("stats").doc(String(t.id)).set({
      downloads: firebase.firestore.FieldValue.increment(1)
    }, {merge:true})
    .then(()=>{
      // принудительное обновление UI
      db.collection("stats").doc(String(t.id)).get()
        .then(doc=>{
          if(doc.exists){
            updateStatsUI(i, doc.data());
          }
        });
    });
  };

  xhr.send();
}

/* ================= SEARCH ================= */

document.getElementById("search").addEventListener("input",(e)=>{
  const v = e.target.value.toLowerCase();

  cards.forEach(c=>{
    const t = c.querySelector("h3").textContent.toLowerCase();
    c.style.display = t.includes(v) ? "block" : "none";
  });
});

/* ================= START ================= */

initCards();

/* ------------------ PLACEHOLDERS ------------------ */

function ads(){ alert("Реклама"); }
function donate(){
  document.getElementById("donateModal").style.display = "block";
}

function closeDonate(){
  document.getElementById("donateModal").style.display = "none";
}

/* ТВОЯ ССЫЛКА BOOSTY */
const BOOSTY_URL = "https://boosty.to/granvekov/donate";

function goBoosty(amount){
  window.open(BOOSTY_URL, "_blank");
}
</script> 

</body> 
</html>
