<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
  cursor: url("music/rock-cursor.png"), auto;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
  gap:10px;
}

#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

.side{ width:60px; display:flex; justify-content:center; }

.logo{
  width:100%;
  display:flex;
  justify-content:center;
  margin:40px 0;
}

.logo img{
  height:420px;
  width:auto;
  max-width:95vw;
  display:block;
  border-radius:16px;
}

.container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  padding:20px;
  padding-bottom:120px;
}

.card {
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
  opacity:0;
  transform:translateY(12px);
  animation:fadeIn 0.5s ease forwards;
}

.card.active{
  border:1px solid #ff3c3c;
  box-shadow:0 0 25px rgba(255,60,60,0.4);
}

@keyframes fadeIn {
  to { opacity:1; transform:translateY(0); }
}

.card img{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

/* ===== DOWNLOAD BUTTON ===== */
.downloadBtn{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  height:40px;
  margin-top:8px;
  background:#ff3c3c;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
  transition:width 0.1s linear;
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

#player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  padding:10px;
  display:flex;
  gap:10px;
}

#cover{ width:50px; height:50px; border-radius:8px; }

.controls{ display:flex; gap:5px; }
.controls button{ width:auto; }
</style>
</head>

<body>

<div class="topbar">
  <div class="side"><button onclick="ads()">📢</button></div>
  <input id="search" placeholder="Поиск музыки...">
  <div class="side"><button onclick="donate()">💰</button></div>
</div>

<div class="logo">
  <img src="music/logo.png">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">
  <div>
    <div id="title">Выбери трек</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶️</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range">
    <audio id="audio"></audio>
  </div>
</div>

<script>

const tracks = [
  {title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"},
  {title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.png"}
];

let current=0;
let cards=[];
let downloadLocks=[];

const audio=document.getElementById("audio");
const title=document.getElementById("title");
const cover=document.getElementById("cover");
const progress=document.getElementById("progress");
const playBtn=document.getElementById("playBtn");
const list=document.getElementById("list");
const search=document.getElementById("search");

function setActive(i){
  cards.forEach(c=>c.classList.remove("active"));
  if(cards[i]) cards[i].classList.add("active");
}

function load(i){
  current=i;
  audio.src=tracks[i].file;
  title.textContent=tracks[i].title;
  cover.src=tracks[i].cover;
  audio.play();
  playBtn.textContent="⏸";
  setActive(i);
}

function next(){load((current+1)%tracks.length);}
function prev(){load((current-1+tracks.length)%tracks.length);}

function toggle(){
  if(audio.paused){
    audio.play();
    playBtn.textContent="⏸";
  }else{
    audio.pause();
    playBtn.textContent="▶️";
  }
}

audio.ontimeupdate=()=>{
  if(audio.duration){
    progress.value=(audio.currentTime/audio.duration)*100;
  }
};

progress.oninput=()=>{
  audio.currentTime=(progress.value/100)*audio.duration;
};

audio.onended=next;

/* ===== CARDS ===== */
tracks.forEach((t,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
    <img src="${t.cover}">
    <h3>${t.title}</h3>
    <button onclick="load(${i})">▶ Play</button>

    <div class="downloadBtn" onclick="download(${i})">
      <div class="fill"></div>
      <span>⬇ Скачать</span>
    </div>
  `;
  list.appendChild(div);
  cards.push(div);
  downloadLocks[i]=false;
});

/* ===== DOWNLOAD WITH REAL PROGRESS ===== */
async function download(i){
  if(downloadLocks[i]) return;
  downloadLocks[i]=true;

  const t=tracks[i];
  const btn=cards[i].querySelector(".downloadBtn");
  const fill=btn.querySelector(".fill");
  const text=btn.querySelector("span");

  fill.style.width="0%";
  text.textContent="0%";

  const res=await fetch(t.file);
  const reader=res.body.getReader();
  const total=+res.headers.get("Content-Length")||1;

  let received=0;
  let chunks=[];

  while(true){
    const {done,value}=await reader.read();
    if(done) break;

    chunks.push(value);
    received+=value.length;

    let percent=Math.floor((received/total)*100);
    fill.style.width=percent+"%";
    text.textContent=percent+"%";
  }

  const blob=new Blob(chunks);
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=t.title+".mp3";
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  setTimeout(()=>{
    fill.style.width="0%";
    text.textContent="⬇ Скачать";
    downloadLocks[i]=false;
  },700);
}

function donate(){window.open("https://paypal.me/yourlink");}
function ads(){alert("Реклама");}

search.oninput=()=>{
  const v=search.value.toLowerCase();
  cards.forEach((c,i)=>{
    c.style.display=tracks[i].title.toLowerCase().includes(v)?"block":"none";
  });
};

</script>
</body>
</html>
