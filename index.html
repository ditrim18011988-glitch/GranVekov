<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">
<link rel="shortcut icon" href="music/favicon.png">
<link rel="apple-touch-icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
  cursor: url("music/rock-cursor.png"), auto;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
  gap:10px;
}

/* SEARCH */
#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

#search:focus{
  box-shadow:0 0 10px rgba(255,60,60,0.4);
}

/* side buttons */
.side{
  width:60px;
  display:flex;
  justify-content:center;
}

/* LOGO */
.logo{
  width:100%;
  display:flex;
  justify-content:center;
  margin:40px 0;
}

.logo img{
  height:420px;
  width:auto;
  max-width:95vw;
  display:block;
  border-radius:16px;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  padding:20px;
  padding-bottom:120px;
}

/* CARD */
.card {
  background:#1a1a25;
  border-radius:16px;
  padding:12px;

  opacity: 0;
  transform: translateY(12px);
  animation: fadeIn 0.5s ease forwards;

  transition: 0.25s ease;
}

/* active */
.card.active{
  border:1px solid #ff3c3c;
  box-shadow:0 0 25px rgba(255,60,60,0.4);
  transform: translateY(-6px) scale(1.03);
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card img{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

/* PLAYER */
#player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  padding:10px;
  display:flex;
  gap:10px;
}

#cover{
  width:50px;
  height:50px;
  border-radius:8px;
}

.controls{
  display:flex;
  gap:5px;
}

.controls button{
  width:auto;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="side">
    <button onclick="ads()">📢</button>
  </div>

  <!-- SEARCH -->
  <input id="search" placeholder="Поиск музыки...">

  <div class="side">
    <button onclick="donate()">💰</button>
  </div>
</div>

<div class="logo">
  <img src="music/logo.png" alt="logo">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">

  <div>
    <div id="title">Выбери трек</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶️</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range" value="0">
    <audio id="audio"></audio>
  </div>
</div>

<script>
const tracks = [
  {
    title:"Чёрная лампа",
    file:"music/track1.mp3",
    cover:"music/cover1.jpg"
  },
  {
    title:"Всадники Ада",
    file:"music/track2.mp3",
    cover:"music/cover2.jpg"
  },
  {
    title:"Чёрное рождество",
    file:"music/track3.mp3",
    cover:"music/cover3.png"
  }
];

let current = 0;
let cards = [];

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const playBtn = document.getElementById("playBtn");
const list = document.getElementById("list");
const search = document.getElementById("search");

/* ACTIVE */
function setActiveTrack(i){
  cards.forEach(c => c.classList.remove("active"));
  if(cards[i]) cards[i].classList.add("active");
}

/* LOAD */
function load(i){
  current = i;

  audio.src = tracks[i].file;
  title.innerText = tracks[i].title;
  cover.src = tracks[i].cover;

  audio.play();
  playBtn.innerText = "⏸";

  setActiveTrack(i);
}

function next(){ load((current+1)%tracks.length); }
function prev(){ load((current-1+tracks.length)%tracks.length); }

function toggle(){
  if(audio.paused){
    audio.play();
    playBtn.innerText = "⏸";
  } else {
    audio.pause();
    playBtn.innerText = "▶️";
  }
}

/* PROGRESS */
audio.ontimeupdate = () => {
  if(audio.duration){
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
};

progress.oninput = () => {
  audio.currentTime = (progress.value / 100) * audio.duration;
};

audio.onended = next;

/* CARDS */
tracks.forEach((t,i)=>{
  const div = document.createElement("div");
  div.className = "card";
  div.style.animationDelay = `${i*0.1}s`;

  div.innerHTML = `
    <img src="${t.cover}">
    <h3>${t.title}</h3>
    <button onclick="load(${i})">▶ Play</button>
    <button onclick="download(${i})">⬇ Скачать</button>
  `;

  list.appendChild(div);
  cards.push(div);
});

/* SEARCH */
search.addEventListener("input", () => {
  const value = search.value.toLowerCase();

  tracks.forEach((t,i)=>{
    const match = t.title.toLowerCase().includes(value);
    cards[i].style.display = match ? "block" : "none";
  });
});

/* DOWNLOAD */
async function download(i){
  const t = tracks[i];

  const response = await fetch(t.file);
  const blob = await response.blob();

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = t.title + ".mp3";

  document.body.appendChild(a);
  a.click();

  a.remove();
  URL.revokeObjectURL(url);
}

function donate(){
  window.open("https://paypal.me/yourlink","_blank");
}

function ads(){
  alert("Реклама здесь");
}
</script>

</body>
</html>
