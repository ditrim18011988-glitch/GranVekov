<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
  cursor: url("music/rock-cursor.png"), auto;
  padding-bottom: calc(140px + env(safe-area-inset-bottom));
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
}

#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

.logo{
  display:flex;
  justify-content:center;
  margin:30px 0;
}

.logo img{
  max-width:90vw;
  max-height:420px;
  border-radius:16px;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
}

.card img{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

.downloadBtn{
  position:relative;
  height:40px;
  margin-top:8px;
  border-radius:10px;
  overflow:hidden;
  background:#222236;
  display:flex;
  align-items:center;
  justify-content:center;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
}

.stats{
  margin-top:6px;
  font-size:13px;
  opacity:0.8;
  display:flex;
  justify-content:center;
  gap:10px;
}

#player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:rgba(10,10,18,0.95);
  backdrop-filter:blur(20px);
  height:92px;
  z-index:999;
}

#cover{
  width:58px;
  height:58px;
  border-radius:10px;
}

#progress{
  width:100%;
}
</style>
</head>

<body>

<div class="topbar">
  <input id="search" placeholder="Поиск музыки...">
</div>

<div class="logo">
  <img src="music/logo.png">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">
  <div style="flex:1">
    <div id="title">Выбери трек</div>

    <button onclick="prev()">⏮</button>
    <button onclick="toggle()" id="playBtn">▶️</button>
    <button onclick="next()">⏭</button>

    <input id="progress" type="range" value="0">
  </div>

  <audio id="audio"></audio>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= TRACKS ================= */
const tracks = [
  {title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"},
  {title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.jpg"},
  {title:"Кролик Роджер", file:"music/track4.mp3", cover:"music/cover4.jpg"},
  {title:"Падший Ангел", file:"music/track5.mp3", cover:"music/cover5.jpg"},
  {title:"Сын Дьявола", file:"music/track7.mp3", cover:"music/cover7.jpg"},
  {title:"Аид", file:"music/track12.mp3", cover:"music/cover12.jpg"},
  {title:"Безмолвный город", file:"music/track13.mp3", cover:"music/cover13.jpg"}
];

let current = -1;
let cards = [];

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const list = document.getElementById("list");

/* ================= SAFE PLAY ================= */
function safePlay(){
  audio.play().catch(()=>{});
}

/* ================= FIXED FIREBASE STATS ================= */
function addPlay(i){
  db.collection("stats").doc(String(i)).set({
    plays: firebase.firestore.FieldValue.increment(1)
  }, {merge:true});
}

function addDownload(i){
  db.collection("stats").doc(String(i)).set({
    downloads: firebase.firestore.FieldValue.increment(1)
  }, {merge:true});
}

function listenStats(i){
  db.collection("stats").doc(String(i)).onSnapshot(doc=>{
    const d = doc.data() || {};
    const p = document.getElementById("p"+i);
    const dwn = document.getElementById("d"+i);

    if(p) p.textContent = d.plays || 0;
    if(dwn) dwn.textContent = d.downloads || 0;
  });
}

/* ================= LOAD ================= */
function load(i){
  current = i;

  addPlay(i);

  audio.src = tracks[i].file;
  title.textContent = tracks[i].title;
  cover.src = tracks[i].cover;

  safePlay();
}

/* ================= UI ================= */
function toggle(){
  if(current === -1) load(0);
  else audio.paused ? safePlay() : audio.pause();
}

function next(){ load((current+1)%tracks.length); }
function prev(){ load((current-1+tracks.length)%tracks.length); }

/* ================= CARDS ================= */
tracks.forEach((t,i)=>{
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${t.cover}">
    <h3>${t.title}</h3>

    <div class="stats">
      👁 <span id="p${i}">0</span>
      ⬇ <span id="d${i}">0</span>
    </div>

    <button onclick="load(${i})">▶ Play</button>

    <div class="downloadBtn" onclick="downloadTrack(${i})">
      <div class="fill"></div>
      <span>⬇ Скачать</span>
    </div>
  `;

  list.appendChild(div);
  cards.push(div);

  listenStats(i);
});

/* ================= DOWNLOAD ================= */
function downloadTrack(i){
  const t = tracks[i];
  const card = cards[i];
  const fill = card.querySelector(".fill");

  const xhr = new XMLHttpRequest();
  xhr.open("GET", t.file);
  xhr.responseType = "blob";

  xhr.onprogress=e=>{
    if(e.lengthComputable){
      fill.style.width=(e.loaded/e.total)*100+"%";
    }
  };

  xhr.onload=()=>{
    const url = URL.createObjectURL(xhr.response);

    const a=document.createElement("a");
    a.href=url;
    a.download=t.title+".mp3";

    addDownload(i);

    a.click();
    URL.revokeObjectURL(url);

    fill.style.width="0%";
  };

  xhr.send();
}

/* ================= SEARCH ================= */
document.getElementById("search").addEventListener("input",(e)=>{
  const v=e.target.value.toLowerCase();

  cards.forEach(c=>{
    const t=c.querySelector("h3").textContent.toLowerCase();
    c.style.display = t.includes(v) ? "block" : "none";
  });
});
</script>

</body>
</html>
