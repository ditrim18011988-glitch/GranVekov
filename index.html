<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
  cursor: url("music/rock-cursor.png"), auto;
  padding-bottom: calc(140px + env(safe-area-inset-bottom));
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#111;
  gap:10px;
}

#search{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1a1a25;
  color:white;
  width:200px;
}

.side{ width:60px; display:flex; justify-content:center; }

.logo{
  display:flex;
  justify-content:center;
  margin:30px 0;
  padding:0 10px;
}

.logo img{
  max-width:90vw;
  max-height:420px;
  border-radius:16px;
}

.container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  padding:20px;
  padding-bottom:220px;
}

.card{
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
  opacity:0;
  transform:translateY(12px);
  animation:fadeIn 0.5s ease forwards;
}

.card.active{
  border:1px solid #ff3c3c;
  box-shadow:0 0 25px rgba(255,60,60,0.4);
}

@keyframes fadeIn{
  to{ opacity:1; transform:translateY(0); }
}

.card img{
  width:100%;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#ff3c3c;
  color:white;
  cursor:pointer;
}

/* DOWNLOAD */
.downloadBtn{
  position:relative;
  height:40px;
  margin-top:8px;
  border-radius:10px;
  overflow:hidden;
  background:#222236;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.downloadBtn .fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff3c3c,#ff7a7a);
}

.downloadBtn span{
  position:relative;
  z-index:2;
}

/* PLAYER */
#player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:rgba(10,10,18,0.95);
  backdrop-filter: blur(20px);
  border-top:1px solid rgba(255,255,255,0.06);
  height:92px;
  box-sizing:border-box;
  z-index:999;
}

#cover{
  width:58px;
  height:58px;
  border-radius:10px;
}

.controls{
  display:flex;
  gap:10px;
}

#progress{
  width:100%;
  height:4px;
}

#togglePlayer{
  margin-left:auto;
  background:#222236;
  border:none;
  color:white;
  border-radius:8px;
  padding:6px 10px;
}

/* MOBILE */
@media (max-width:768px){
  .container{
    grid-template-columns:repeat(2,1fr);
  }

  #search{ width:100%; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="side"><button onclick="ads()">📢</button></div>
  <input id="search" placeholder="Поиск музыки...">
  <div class="side"><button onclick="donate()">💰</button></div>
</div>

<div class="logo">
  <img src="music/logo.png">
</div>

<div class="container" id="list"></div>

<div id="player">
  <img id="cover">

  <div style="flex:1">
    <div id="title">Выбери трек</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()" id="playBtn">▶️</button>
      <button onclick="next()">⏭</button>
    </div>

    <input id="progress" type="range" value="0">
  </div>

  <button id="togglePlayer">▾</button>
  <audio id="audio"></audio>
</div>
<script>

<script>

const tracks = [
  {title:"Чёрная лампа", file:"music/track1.mp3", cover:"music/cover1.jpg"},
  {title:"Всадники Ада", file:"music/track2.mp3", cover:"music/cover2.jpg"},
  {title:"Чёрное рождество", file:"music/track3.mp3", cover:"music/cover3.jpg"},
  {title:"Кролик Роджер", file:"music/track4.mp3", cover:"music/cover4.jpg"},
  {title:"Падший Ангел", file:"music/track5.mp3", cover:"music/cover5.jpg"},
  {title:"Белоснежка и семь грехов: Союз тьмы", file:"music/track6.mp3", cover:"music/cover6.jpg"},
  {title:"Сын Дьявола", file:"music/track7.mp3", cover:"music/cover7.jpg"},
  {title:"До последнего шага", file:"music/track8.mp3", cover:"music/cover8.jpg"},
  {title:"Распутин-Демон порока", file:"music/track9.mp3", cover:"music/cover9.jpg"},
  {title:"Питер Пэн-похититель детей", file:"music/track10.mp3", cover:"music/cover10.jpg"},
  {title:"Пиковая Дама", file:"music/track11.mp3", cover:"music/cover11.jpg"},
  {title:"Аид", file:"music/track12.mp3", cover:"music/cover12.jpg"},
  {title:"Безмолвный город", file:"music/track13.mp3", cover:"music/cover13.jpg"},
  {title:"Северный рубеж", file:"music/track14.mp3", cover:"music/cover14.jpg"}
];

let current = -1;
let cards = [];

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const playBtn = document.getElementById("playBtn");
const list = document.getElementById("list");

/* ================= SAFE PLAY ================= */
function safePlay(){
  const p = audio.play();
  if(p) p.catch(()=>{});
}

/* ================= LOAD TRACK ================= */
function load(i){
  current = i;

  audio.src = tracks[i].file;
  title.textContent = tracks[i].title;
  cover.src = tracks[i].cover;

  safePlay();
  syncUI();
}

/* ================= PLAY / PAUSE ================= */
function toggle(){

  // если трек ещё не выбран
  if(current === -1){
    load(0);
    return;
  }

  if(audio.paused) safePlay();
  else audio.pause();

  syncUI();
}

/* ================= CARD CLICK ================= */
function toggleTrack(i){

  // новый трек
  if(i !== current){
    load(i);
    return;
  }

  // тот же трек — НЕ перезагружаем
  if(audio.paused){
    safePlay();
  } else {
    audio.pause();
  }

  syncUI();
}

/* ================= NEXT / PREV ================= */
function next(){
  if(current === -1) return load(0);
  load((current + 1) % tracks.length);
}

function prev(){
  if(current === -1) return load(0);
  load((current - 1 + tracks.length) % tracks.length);
}

/* ================= UI ================= */
function syncUI(){

  playBtn.textContent = audio.paused ? "▶️" : "⏸";

  cards.forEach((c,i)=>{
    const btn = c.querySelector("button");

    if(i === current && !audio.paused){
      btn.textContent = "⏸ Pause";
      c.classList.add("active");
    } else {
      btn.textContent = "▶ Play";
      c.classList.remove("active");
    }
  });
}

/* ================= EVENTS ================= */
audio.addEventListener("play", syncUI);
audio.addEventListener("pause", syncUI);
audio.addEventListener("ended", next);

/* ================= PROGRESS ================= */
audio.ontimeupdate = () => {
  if(audio.duration){
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
};

progress.oninput = () => {
  audio.currentTime = (progress.value / 100) * audio.duration;
};

/* ================= BUILD CARDS ================= */
tracks.forEach((t,i)=>{
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${t.cover}">
    <h3>${t.title}</h3>

    <button onclick="toggleTrack(${i})">▶ Play</button>

    <div class="downloadBtn" onclick="downloadTrack(${i})">
      <div class="fill"></div>
      <span>⬇ Скачать</span>
    </div>
  `;

  list.appendChild(div);
  cards.push(div);
});

/* ================= DOWNLOAD (FIXED + PROGRESS) ================= */
function downloadTrack(i){
  const t = tracks[i];
  const card = cards[i];
  const fill = card.querySelector(".fill");

  const xhr = new XMLHttpRequest();
  xhr.open("GET", t.file, true);
  xhr.responseType = "blob";

  xhr.onprogress = (e) => {
    if (e.lengthComputable) {
      const percent = (e.loaded / e.total) * 100;
      fill.style.width = percent + "%";
    }
  };

  xhr.onload = () => {
    if (xhr.status === 200) {
      const url = URL.createObjectURL(xhr.response);

      const a = document.createElement("a");
      a.href = url;

      const safeName = t.title
        .replace(/[\/\\:*?"<>|]/g, "")
        .trim();

      a.download = safeName + ".mp3";

      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);

      fill.style.width = "0%";
    }
  };

  xhr.onerror = () => {
    alert("Ошибка скачивания");
    fill.style.width = "0%";
  };

  xhr.send();
}

/* ================= EXTRA BUTTONS ================= */
document.getElementById("togglePlayer").onclick = () => {
  document.getElementById("player").classList.toggle("collapsed");
};

function donate(){
  window.open("https://paypal.me/yourlink");
}

function ads(){
  alert("Реклама");
}

</script>

</body>
</html>
