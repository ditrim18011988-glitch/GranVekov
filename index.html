<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Грань Веков</title>

<link rel="icon" href="music/favicon.png">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="topbar">

    <div class="side">
        <button onclick="ads()">📢</button>
    </div>

    <input
        type="text"
        id="search"
        placeholder="Поиск музыки..."
    >

    <div class="side">
        <button onclick="donate()">💰</button>
    </div>

</div>


<div class="logo">
    <img src="music/logo.png" alt="">
</div>


<div class="container" id="list"></div>


<div id="player">

    <img id="cover" src="music/cover1.jpg">

    <div class="playerCenter">

        <div id="title">
            Выбери трек
        </div>

        <div class="controls">

            <button onclick="prev()">
                ⏮
            </button>

            <button id="playBtn" onclick="toggle()">
                ▶️
            </button>

            <button onclick="next()">
                ⏭
            </button>

        </div>

        <input
            id="progress"
            type="range"
            value="0"
        >

    </div>

    <button id="togglePlayer">
        ▾
    </button>

    <audio id="audio"></audio>

</div>


<script src="script.js"></script>

</body>
</html>
