<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Vekov</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0b10;
  color:white;
}

header{
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  background:#141420;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
  padding:20px;
  padding-bottom:120px;
}

/* CARD */
.card{
  background:#1a1a25;
  border-radius:16px;
  padding:12px;
  transition:.2s;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}
.card:hover{transform:scale(1.03)}

.card img{
  width:100%;
  border-radius:12px;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#ff3c3c;
  color:white;
}
button:hover{background:#ff1f1f}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  background:#111;
}

/* PLAYER */
#player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f0f18;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-top:1px solid #333;
}

#player img{
  width:50px;
  height:50px;
  border-radius:8px;
}

#progress{
  width:200px;
}

/* SMALL TEXT */
.small{
  font-size:12px;
  color:#aaa;
}

a{color:#4da3ff}
</style>
</head>

<body>

<header>🎧 Gran Vekov</header>

<div class="topbar">
  <div id="stats">Загрузка...</div>
  <button onclick="donate()">💰 Донат</button>
</div>

<div class="container" id="list"></div>

<!-- PLAYER -->
<div id="player">
  <img id="cover">
  <div>
    <div id="title"></div>
    <div class="small" id="trackStats"></div>
    <audio id="audio"></audio>
    <input id="progress" type="range" min="0" value="0">
  </div>

  <button onclick="prev()">⏮</button>
  <button onclick="toggle()">▶️</button>
  <button onclick="next()">⏭</button>
</div>

<script>

const tracks = [
{
    title: "Чёрная лампа",
    file: "music/track1.mp3",
    cover:  "music/cover1.jpeg",
    plays: 0
  },

  {
    title: "Всадники Ада",
    file: "music/track2.mp3",
    cover: "music/cover2.jpeg",
    plays: 0
 }
];

let current=0;

const audio=document.getElementById("audio");
const title=document.getElementById("title");
const cover=document.getElementById("cover");
const stats=document.getElementById("stats");
const trackStats=document.getElementById("trackStats");
const progress=document.getElementById("progress");

/* LOAD */
function load(i){
  current=i;
  audio.src=tracks[i].file;
  title.innerText=tracks[i].title;
  cover.src=tracks[i].cover;
  audio.play();
  savePlay(i);
}

/* NEXT PREV */
function next(){load((current+1)%tracks.length)}
function prev(){load((current-1+tracks.length)%tracks.length)}

function toggle(){
  if(audio.paused) audio.play();
  else audio.pause();
}

/* AUTOPLAY */
audio.onended=next;

/* PROGRESS BAR */
audio.ontimeupdate=()=>{
  progress.value=(audio.currentTime/audio.duration)*100;
}

progress.oninput=()=>{
  audio.currentTime=(progress.value/100)*audio.duration;
}

/* RENDER LIST */
const list=document.getElementById("list");

tracks.forEach((t,i)=>{
  list.innerHTML+=`
  <div class="card">
    <img src="${t.cover}">
    <h3>${t.title}</h3>

    <button onclick="load(${i})">▶ Play</button>
    <button onclick="download('${t.file}')">⬇ Скачать</button>

    <div class="small">Прослушиваний: <span id="p${i}">0</span></div>
  </div>
  `;
});

/* DOWNLOAD */
function download(f){
  const a=document.createElement("a");
  a.href=f;
  a.download="";
  a.click();
}

/* LOCAL STATS */
function savePlay(i){
  let key="track_"+i;
  let val=localStorage.getItem(key)||0;
  val++;
  localStorage.setItem(key,val);
  document.getElementById("p"+i).innerText=val;
}

/* GLOBAL STATS */
function updateStats(){
  let total=0;
  tracks.forEach((_,i)=>{
    total+=Number(localStorage.getItem("track_"+i)||0);
  });
  stats.innerText="Прослушивания: "+total;
}

setInterval(updateStats,1000);
updateStats();

/* DONATE */
function donate(){
  window.open("https://paypal.me/yourlink","_blank");
}

</script>

</body>
</html>
