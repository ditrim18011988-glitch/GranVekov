<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GranVekov</title>




  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1a1a1a;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1e1e1e;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    h3 {
      margin: 10px 0;
    }

    audio {
      width: 100%;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #ff3c3c;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #ff1f1f;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      background: #141414;
    }

    .stats {
      font-size: 14px;
      color: #aaa;
    }

    .donate {
      background: #00c853;
    }

  </style>
</head>
<body>

<header>🎵 Грань Веков</header>


<div class="topbar">
  <div class="stats" id="stats">Загрузка...</div>
  <button class="donate" onclick="donate()">Поддержать автора</button>
</div>

<!-- Ad block -->
<div style="text-align:center; margin:20px;">
  <p>Реклама (вставь Google AdSense)</p>
</div>

<div class="container" id="musicList"></div>

<script>

const tracks = [
  {
    title: "Чёрная лампа",
    file: "music/track1.mp3",
    cover:  "music/cover1.jpeg",
    plays: 0
  },

  {
    title: "Track 2",
    file: "music/track2.mp3",
    cover: "https://via.placeholder.com/300",
    plays: 0
  }
];

const container = document.getElementById("musicList");

tracks.forEach((track, index) => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${track.cover}">
    <h3>${track.title}</h3>
    <audio controls onplay="addPlay(${index})">
      <source src="${track.file}" type="audio/mpeg">
    </audio>
    <button onclick="download('${track.file}')">Скачать</button>
    <div>Прослушиваний: <span id="plays-${index}">0</span></div>
  `;

  container.appendChild(card);
});

function addPlay(index) {
  tracks[index].plays++;
  document.getElementById(`plays-${index}`).innerText = tracks[index].plays;

  let total = localStorage.getItem("totalPlays") || 0;
  total++;
  localStorage.setItem("totalPlays", total);
  updateStats();
}

function download(file) {
  const a = document.createElement("a");
  a.href = file;
  a.download = "";
  a.click();
}

function donate() {
  alert("Добавь сюда ссылку на донаты (например PayPal или Stripe)");
}

function updateStats() {
  const visits = localStorage.getItem("visits") || 0;
  const plays = localStorage.getItem("totalPlays") || 0;
  document.getElementById("stats").innerText = `Посещения: ${visits} | Прослушивания: ${plays}`;
}

let visits = localStorage.getItem("visits") || 0;
visits++;
localStorage.setItem("visits", visits);

updateStats();

</script>

</body>
</html>
